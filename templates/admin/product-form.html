{% include 'partials/header.html' %}

<div class="flex min-h-[calc(100vh-64px)]">
  {% include 'admin/sidebar.html' %}
  <div class="flex-1 p-6 overflow-x-auto">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-[#333]"><i class="fas fa-box text-[#6f04c7]"></i> {{ 'Edit Product' if product else 'New Product' }}</h1>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-[#e9d5ff] p-6 max-w-2xl">
      <form action="{{ '/admin/products/edit/' ~ product.id if product else '/admin/products/new' }}" method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-[#333] mb-1">Product Name</label>
          <input type="text" name="name" value="{{ product.name if product else '' }}" required class="w-full px-3 py-2 border border-[#e9d5ff] rounded-lg text-sm outline-none focus:border-[#c084fc] bg-[#f3e8ff]">
        </div>
        <div>
          <label class="block text-sm font-medium text-[#333] mb-1">Description</label>
          <textarea name="description" rows="4" class="w-full px-3 py-2 border border-[#e9d5ff] rounded-lg text-sm outline-none focus:border-[#c084fc] bg-[#f3e8ff]">{{ product.description if product else '' }}</textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-[#333] mb-1">Price ($)</label>
            <input type="number" name="price" step="0.01" value="{{ product.price if product else '' }}" required class="w-full px-3 py-2 border border-[#e9d5ff] rounded-lg text-sm outline-none focus:border-[#c084fc] bg-[#f3e8ff]">
          </div>
          <div>
            <label class="block text-sm font-medium text-[#333] mb-1">Cost Price ($)</label>
            <input type="number" name="cost_price" step="0.01" value="{{ product.cost_price if product else '0' }}" class="w-full px-3 py-2 border border-[#e9d5ff] rounded-lg text-sm outline-none focus:border-[#c084fc] bg-[#f3e8ff]">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-[#333] mb-1">Stock</label>
            <input type="number" name="stock" value="{{ product.stock if product else '0' }}" required class="w-full px-3 py-2 border border-[#e9d5ff] rounded-lg text-sm outline-none focus:border-[#c084fc] bg-[#f3e8ff]">
          </div>
          <div>
            <label class="block text-sm font-medium text-[#333] mb-1">Barcode / SKU</label>
            <input type="text" name="barcode" value="{{ product.barcode if product else '' }}" class="w-full px-3 py-2 border border-[#e9d5ff] rounded-lg text-sm outline-none focus:border-[#c084fc] bg-[#f3e8ff]">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-[#333] mb-1">Category</label>
            <select name="category_id" class="w-full px-3 py-2 border border-[#e9d5ff] rounded-lg text-sm outline-none focus:border-[#c084fc] bg-[#f3e8ff]">
              {% for c in categories %}
                <option value="{{ c.id }}" {{ 'selected' if product and product.category_id == c.id else '' }}>{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="flex items-end pb-2">
            <label class="flex items-center gap-2 text-sm font-medium text-[#333] cursor-pointer">
              <input type="checkbox" name="featured" value="1" {{ 'checked' if product and product.featured else '' }} class="w-4 h-4 rounded border-[#e9d5ff] text-[#6f04c7] focus:ring-[#c084fc]">
              Featured Product
            </label>
          </div>
        </div>
        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="px-4 py-2 bg-[#6f04c7] text-white rounded-lg text-sm font-medium hover:bg-[#580bbe] transition"><i class="fas fa-save"></i> {{ 'Update Product' if product else 'Create Product' }}</button>
          <a href="/admin/products" class="px-4 py-2 border border-[#e9d5ff] text-[#333] rounded-lg text-sm font-medium hover:bg-[#f3e8ff] transition">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

{% include 'partials/footer.html' %}
