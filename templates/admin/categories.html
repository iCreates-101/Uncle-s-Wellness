{% include 'partials/header.html' %}

<div class="flex min-h-[calc(100vh-64px)]">
  {% include 'admin/sidebar.html' %}
  <div class="flex-1 p-6 overflow-x-auto">
    <h1 class="text-2xl font-bold text-[#3d2c2a] mb-6"><i class="fas fa-tags text-[#c4907a]"></i> Categories</h1>

    <div class="bg-white rounded-xl shadow-sm border border-[#e8ddd9] p-5 mb-6">
      <form action="/admin/categories/new" method="POST">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-[#3d2c2a] mb-1">Category Name</label>
            <input type="text" name="name" required class="w-full px-3 py-2 border border-[#e8ddd9] rounded-lg text-sm outline-none focus:border-[#c4907a] bg-[#faf7f5]">
          </div>
          <div>
            <label class="block text-sm font-medium text-[#3d2c2a] mb-1">Description</label>
            <input type="text" name="description" class="w-full px-3 py-2 border border-[#e8ddd9] rounded-lg text-sm outline-none focus:border-[#c4907a] bg-[#faf7f5]">
          </div>
          <div class="flex items-end">
            <button type="submit" class="px-4 py-2 bg-[#c4907a] text-white rounded-lg text-sm font-medium hover:bg-[#a8715c] transition"><i class="fas fa-plus"></i> Add Category</button>
          </div>
        </div>
      </form>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-[#e8ddd9] overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-[#faf7f5] text-[#8a7a76] uppercase text-xs tracking-wider">
              <th class="text-left px-4 py-3 font-semibold">ID</th>
              <th class="text-left px-4 py-3 font-semibold">Name</th>
              <th class="text-left px-4 py-3 font-semibold">Slug</th>
              <th class="text-center px-4 py-3 font-semibold">Products</th>
              <th class="text-center px-4 py-3 font-semibold">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-[#f0e8e4]">
            {% for c in categories %}
              <tr class="hover:bg-[#faf7f5] transition">
                <td class="px-4 py-3 text-[#8a7a76] text-xs">{{ c.id }}</td>
                <td class="px-4 py-3 font-medium text-[#3d2c2a]">{{ c.name }}</td>
                <td class="px-4 py-3 text-[#8a7a76]">{{ c.slug }}</td>
                <td class="px-4 py-3 text-center text-[#3d2c2a]">{{ c.product_count }}</td>
                <td class="px-4 py-3 text-center">
                  <form action="/admin/categories/delete/{{ c.id }}" method="POST" onsubmit="return confirm('Delete this category?')" class="inline">
                    <button type="submit" class="inline-flex items-center px-2.5 py-1.5 rounded text-xs font-medium bg-red-50 text-red-600 hover:bg-red-600 hover:text-white transition"><i class="fas fa-trash"></i></button>
                  </form>
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

{% include 'partials/footer.html' %}
