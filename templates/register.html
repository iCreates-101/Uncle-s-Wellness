{% include 'partials/header.html' %}

<div class="min-h-[60vh] flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md bg-white rounded-xl border border-[#e8ddd9] p-8">
    <div class="text-center mb-6">
      <i class="fas fa-leaf text-4xl text-[#c4907a]"></i>
      <h2 class="text-2xl font-bold text-[#3d2c2a] mt-2">Create Account</h2>
      <p class="text-sm text-[#8a7a76]">Join Uncle's Wellness family</p>
    </div>
    {% if error %}<div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">{{ error }}</div>{% endif %}
    <form action="/register" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-[#3d2c2a] mb-1">Full Name</label>
        <input type="text" name="name" placeholder="John Doe" required class="w-full px-3 py-2 border border-[#e8ddd9] rounded-lg text-sm outline-none focus:border-[#c4907a] bg-[#faf7f5]">
      </div>
      <div>
        <label class="block text-sm font-medium text-[#3d2c2a] mb-1">Email</label>
        <input type="email" name="email" placeholder="your@email.com" required class="w-full px-3 py-2 border border-[#e8ddd9] rounded-lg text-sm outline-none focus:border-[#c4907a] bg-[#faf7f5]">
      </div>
      <div>
        <label class="block text-sm font-medium text-[#3d2c2a] mb-1">Password</label>
        <input type="password" name="password" placeholder="At least 6 characters" minlength="6" required class="w-full px-3 py-2 border border-[#e8ddd9] rounded-lg text-sm outline-none focus:border-[#c4907a] bg-[#faf7f5]">
      </div>
      <div>
        <label class="block text-sm font-medium text-[#3d2c2a] mb-1">Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm your password" required class="w-full px-3 py-2 border border-[#e8ddd9] rounded-lg text-sm outline-none focus:border-[#c4907a] bg-[#faf7f5]">
      </div>
      <button type="submit" class="w-full px-4 py-2.5 bg-[#c4907a] text-white rounded-lg font-medium hover:bg-[#a8715c] transition">Create Account</button>
    </form>
    <p class="text-center text-sm text-[#8a7a76] mt-4">Already have an account? <a href="/login" class="text-[#c4907a] hover:underline font-medium">Sign in</a></p>
  </div>
</div>

{% include 'partials/footer.html' %}
