services:
  - type: web
    name: uncles-wellness
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://uncles-wellness.vercel.app,http://localhost:3000,http://localhost:8000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false